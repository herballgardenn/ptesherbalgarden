<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PTES Herbal Garden</title>
<meta name="description" content="Care guide for the PTES herbal garden: light, water, soil and benefits.">
<meta name="theme-color" content="#2f6b3f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f3ea;--card:#fff;--ink:#1c2b20;--mute:#5f6e63;--acc:#2f6b3f;--soft:#e8efe0;--line:#e0dccd;--sh:0 6px 20px rgba(30,50,35,.08);--gc:#4c9a52}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0f1712;--card:#18231b;--ink:#e9f0e7;--mute:#9db0a1;--acc:#86cf98;--soft:#213126;--line:#2b3d30;--sh:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 Inter,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;min-height:100vh}
main{max-width:760px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(48px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px))}
h1,h2,h3{font-family:Fraunces,Georgia,"Times New Roman",serif;line-height:1.15;margin:0}
a{color:inherit}
.view{animation:in .4s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:36px 24px 28px;color:#fff;box-shadow:var(--sh);background:radial-gradient(circle at 88% 12%,rgba(255,255,255,.25),transparent 42%),radial-gradient(circle at 5% 100%,rgba(255,255,255,.14),transparent 45%),linear-gradient(135deg,#4aa264,#1b472b)}
.hero .lf{position:absolute;right:-6px;top:-10px;font-size:7rem;opacity:.16;transform:rotate(18deg)}
.hero h1{font-size:2.3rem;position:relative}
.hero p{margin:10px 0 16px;opacity:.92;max-width:34ch;position:relative}
.stats{display:flex;gap:8px;flex-wrap:wrap;position:relative}
.stats span{background:rgba(255,255,255,.18);border-radius:99px;padding:5px 12px;font-size:.85rem;font-weight:600}
.search{margin:18px 0 6px}
.search input{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:14px 16px;font:inherit;box-shadow:var(--sh);outline:none}
.search input:focus{border-color:var(--acc)}
.res{margin-top:8px}
.sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);font-weight:700;margin:22px 4px 10px}
.grid{display:grid;gap:12px}
@media (min-width:600px){.grid{grid-template-columns:1fr 1fr}}
.gcard{display:flex;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;text-decoration:none;box-shadow:var(--sh);transition:transform .15s}
.gcard:hover{transform:translateY(-3px)}
.em{font-size:1.7rem;background:var(--gc);border-radius:16px;width:56px;height:56px;display:flex;align-items:center;justify-content:center;flex:none}
.gcard b{display:block;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--mute)}
.gcard span.t{font-weight:600;line-height:1.3;display:block}
.gcard small{color:var(--mute)}
.back{display:inline-block;margin-bottom:14px;color:var(--acc);text-decoration:none;font-weight:600}
.gh,.ph{border-radius:26px;color:#fff;padding:26px 22px;box-shadow:var(--sh);background:radial-gradient(circle at 90% 10%,rgba(255,255,255,.28),transparent 45%),linear-gradient(135deg,rgba(0,0,0,0),rgba(0,0,0,.38)),var(--gc)}
.gh .tag{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;opacity:.9}
.gh h2{font-size:1.7rem;margin:6px 0 14px}
.cond{background:rgba(255,255,255,.2);border-radius:16px;padding:12px 14px}
.note{background:var(--card);border:1px dashed var(--gc);border-radius:16px;padding:12px 14px;margin:14px 0;font-size:.92rem}
.tbl{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--sh);margin-top:14px}
.tbl a{display:flex;align-items:center;gap:12px;padding:14px 16px;text-decoration:none;border-top:1px solid var(--line);font-weight:500}
.tbl a:first-of-type{border-top:0}
.tbl a:hover{background:var(--soft)}
.tbl i{font-style:normal;background:var(--gc);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:700;flex:none}
.tbl em{margin-left:auto;font-style:normal;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.chips a{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 12px;font-size:.88rem;text-decoration:none}
.ph .pill{display:inline-block;background:rgba(255,255,255,.22);border-radius:99px;padding:4px 12px;font-size:.8rem;font-weight:600;text-decoration:none;margin-bottom:12px}
.ph h2{font-size:2rem}.ph i{display:block;opacity:.9;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.tile,.big{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--sh)}
.tile .ic{font-size:1.6rem}
.tile h3,.big h3{font:700 .78rem Inter,sans-serif;text-transform:uppercase;letter-spacing:.1em;color:var(--mute);margin:4px 0}
.tile p,.big p{margin:0}
.big{margin-top:12px;border-left:6px solid var(--gc)}
.big.tip{background:var(--soft)}
.nav{display:flex;gap:10px;margin-top:18px}
.nav a{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;text-decoration:none;font-size:.9rem;box-shadow:var(--sh)}
.nav a small{display:block;color:var(--mute)}
.nav a:last-child{text-align:right}
.fine{color:var(--mute);font-size:.82rem;margin-top:16px}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-top:14px}
.q{background:#fff;color:#111;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.q img{width:100%;max-width:170px;image-rendering:pixelated}
.q b{display:block;margin-top:6px}.q small{color:#555}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;margin:8px 8px 8px 0}
.inp{width:100%;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit}
.warn{background:#fff3d6;color:#6b4e08;border-radius:12px;padding:10px 14px;margin:10px 0}
footer{text-align:center;margin-top:30px;color:var(--mute);font-size:.85rem}
footer a{color:var(--acc)}
@media print{.noprint{display:none}body{background:#fff}}
.fbo{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.fbc{position:relative;background:var(--card);color:var(--ink);border-radius:24px;padding:24px 20px 20px;width:100%;max-width:420px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:in .3s ease both}
.fbc h2{font-size:1.5rem;padding-right:28px}
.fbx{position:absolute;top:10px;right:12px;background:none;border:0;font-size:1.8rem;line-height:1;color:var(--mute);cursor:pointer}
.rate{display:flex;gap:8px;margin-bottom:12px}
.rate button{flex:1;font-size:1.6rem;background:var(--soft);border:2px solid transparent;border-radius:14px;padding:8px 0;cursor:pointer}
.rate button.on{border-color:var(--acc);background:var(--card);transform:scale(1.08)}
.fbc textarea{resize:vertical}
.ghost{background:transparent;color:var(--mute)}
.lnk{background:none;border:0;color:var(--acc);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
@media print{.fbo{display:none}}
</style></head><body><main id="app"></main>

 <div class="ph"><a class="pill" href="#g${k}">${g.e} Group ${k}</a><h2>${p.n}</h2><i>${p.l}</i></div>
 <div class="tiles"><div class="tile"><div class="ic">☀️</div><h3>Light</h3><p>${p.s}</p></div><div class="tile"><div class="ic">💧</div><h3>Water</h3><p>${p.w}</p></div><div class="tile"><div class="ic">🌱</div><h3>Soil</h3><p>${p.o}</p></div></div>

function qr(u){
 u=u||base();let h="";
 try{const q=qrcode(0,"M");q.addData(u.split("#")[0]);q.make();h=q.createImgTag(8,10)}catch(e){h="<p>QR library unavailable (needs internet)</p>"}
 h=`<div class="q">${h}<b>PTES Herbal Garden</b><small>Scan to open the plant guide</small></div>`;
 show(`<a class="back noprint" href="#">← Back</a><h2>Printable QR code</h2>
 ${location.protocol=="file:"?`<div class="warn noprint">You're viewing this from your own computer. Open the page from its public link, or paste that link below.</div>`:""}
 <p class="noprint fine">This one code opens the whole website. Check the link below is your public site address, then print.</p>
 <input id="u" class="inp noprint" value="${u}"><button class="btn noprint" onclick="qr(document.getElementById('u').value)">Update code</button><button class="btn noprint" onclick="window.print()">🖨 Print</button>
 <div class="qrs" style="grid-template-columns:1fr;max-width:300px;margin:14px auto">${h}</div>`)}
function route(){
 const h=cur!==null?cur:location.hash.slice(1),a=h.split("/");try{window.scrollTo(0,0)}catch(e){}
 if(/^g[1-6]$/.test(h))group(+h[1]);
 else if(a[0]=="p")plant(a[1],a[2]);
 else if(h=="qr")qr();else home()}
// ---- Feedback: opens your Microsoft Form in a new tab (responses are only visible to you in Microsoft Forms) ----
const FORM_URL="https://forms.cloud.microsoft/r/JqRSaPSvXP?origin=lprLink";
const ls=(a,k,v)=>{try{return v===undefined?a.getItem(k):a.setItem(k,v)}catch(e){}};
function closeFb(){const d=document.getElementById("fb");if(d)d.remove();ls(sessionStorage,"fbSeen","1")}
function doneFb(){ls(localStorage,"fbDone","1");setTimeout(closeFb,300)}
function openFb(){
 if(!FORM_URL||document.getElementById("fb"))return;
 const d=document.createElement("div");d.id="fb";d.className="fbo";
 d.innerHTML='<div class="fbc" role="dialog" aria-modal="true" aria-label="Feedback"><button class="fbx" aria-label="Close" onclick="closeFb()">&times;</button><h2>🌿 We&rsquo;d love your feedback</h2><p style="margin:8px 0 16px">Thanks for visiting the PTES Herbal Garden! Tell us what you think in a quick form. It takes under a minute.</p><a class="btn" style="display:block;text-align:center;text-decoration:none;margin:0 0 8px" href="'+FORM_URL+'" target="_blank" rel="noopener noreferrer" onclick="doneFb()">Open feedback form</a><button class="btn ghost" style="width:100%;margin:0" type="button" onclick="closeFb()">Maybe later</button><p class="fine" style="text-align:center;margin:10px 0 0">Opens in a new tab</p></div>';
 document.body.appendChild(d)}
function initFb(){if(!FORM_URL||ls(localStorage,"fbDone")||ls(sessionStorage,"fbSeen"))return;setTimeout(openFb,800)}
let cur=null;
function go(h){cur=h;try{location.hash=h}catch(e){}route()}
document.addEventListener("click",e=>{const a=e.target.closest&&e.target.closest("a[href^='#']");if(!a)return;e.preventDefault();go(a.getAttribute("href").slice(1))});
addEventListener("hashchange",()=>{if(location.hash.slice(1)!==cur){cur=null;route()}});
route();initFb();
</script></body></html>
